# Hệ thống thiết kế — xem tuyensinh/ui.py (TOKENS) để biết màu trạng thái dùng chung.

[server]
maxUploadSize = 50
enableStaticServing = true

[client]
toolbarMode = "minimal"

[browser]
# Không gửi thống kê sử dụng ra ngoài (dữ liệu học sinh)
gatherUsageStats = false

[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
baseFontSize = 15
baseRadius = "0.625rem"
buttonRadius = "0.5rem"
showWidgetBorder = true
showSidebarBorder = true
headingFontSizes = ["1.625rem", "1.25rem", "1.0625rem", "0.9375rem", "0.875rem", "0.8125rem"]
headingFontWeights = [700, 600, 600, 600, 600, 600]
metricValueFontSize = "1.625rem"
metricValueFontWeight = 600
linkUnderline = false
chartCategoricalColors = ["#007AFF", "#FF9500", "#34C759", "#8E8E93", "#AF52DE", "#FF2D55"]

[theme.light]
# Bảng màu macOS (Apple system colors)
primaryColor = "#007AFF"
backgroundColor = "#F5F5F7"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1D1D1F"
borderColor = "#D9D9DE"
dataframeHeaderBackgroundColor = "#F5F5F7"
linkColor = "#0066CC"

[theme.light.sidebar]
backgroundColor = "#ECECEE"
secondaryBackgroundColor = "#FFFFFF"
borderColor = "#D9D9DE"

[theme.dark]
primaryColor = "#0A84FF"
backgroundColor = "#1C1C1E"
secondaryBackgroundColor = "#2C2C2E"
textColor = "#F5F5F7"
borderColor = "#3A3A3C"
dataframeHeaderBackgroundColor = "#2C2C2E"
linkColor = "#409CFF"

[theme.dark.sidebar]
backgroundColor = "#232325"
secondaryBackgroundColor = "#2C2C2E"
borderColor = "#3A3A3C"
